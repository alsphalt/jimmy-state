<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="JIMMY STATE — identify any song, discover music, stream videos and save authorized downloads in one premium app." />
    <meta name="theme-color" content="#05060a" />
    <meta name="color-scheme" content="dark" />
    <!-- Runs before the stylesheets paint: without it a light-theme user sees a black
         flash on every load, and an installed PWA flashes its splash colour. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('jimmy-state:theme') || 'dark'
          var isLight =
            pref === 'light' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: light)').matches)
          var theme = isLight ? 'light' : 'dark'
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          root.style.colorScheme = theme
          var color = document.querySelector('meta[name="theme-color"]')
          if (color) color.setAttribute('content', theme === 'light' ? '#f4f5fa' : '#05060a')
          var scheme = document.querySelector('meta[name="color-scheme"]')
          if (scheme) scheme.setAttribute('content', theme)
        } catch (e) {}
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JIMMY STATE" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Speeds up the first frame of the YouTube player, which matters for long mixes. -->
    <link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
    <title>JIMMY STATE — Identify Any Song</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
