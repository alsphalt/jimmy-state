name: Android APK

# One project, three targets. This workflow is the only thing that produces the APK:
# it builds the very same web bundle the website and the PWA serve, wraps it with
# Capacitor, and publishes the result as `jimmy-state.apk` on the latest release —
# the exact URL public/app/version.json advertises, so installed apps can update
# themselves in place.
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle
        run: npm run build
        env:
          # The APK is served from https://localhost inside the WebView, so every API
          # call has to be absolute. Set this repository variable to the site origin.
          VITE_API_BASE: ${{ vars.JIMMY_API_BASE }}

      - name: Sync the Capacitor shell
        run: npx cap sync android

      - name: Restore the signing key
        if: ${{ secrets.JIMMY_KEYSTORE_BASE64 != '' }}
        run: echo "$JIMMY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jimmy-release.jks"
        env:
          JIMMY_KEYSTORE_BASE64: ${{ secrets.JIMMY_KEYSTORE_BASE64 }}

      - name: Build the release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          JIMMY_KEYSTORE: ${{ secrets.JIMMY_KEYSTORE_BASE64 != '' && format('{0}/jimmy-release.jks', runner.temp) || '' }}
          JIMMY_KEYSTORE_PASSWORD: ${{ secrets.JIMMY_KEYSTORE_PASSWORD }}
          JIMMY_KEY_ALIAS: ${{ secrets.JIMMY_KEY_ALIAS }}
          JIMMY_KEY_PASSWORD: ${{ secrets.JIMMY_KEY_PASSWORD }}

      - name: Name the artifact the update manifest expects
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "jimmy-state.apk"
          echo "APK_SHA256=$(sha256sum jimmy-state.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: JIMMY STATE ${{ env.VERSION }} (Android)
          tag_name: ${{ github.ref_name }}
          files: jimmy-state.apk
          make_latest: true
          body: |
            Android build of JIMMY STATE ${{ env.VERSION }}.

            Install it over an existing copy to update in place — the library,
            playlists, downloads, settings and language are kept.
            SHA-256: `${{ env.APK_SHA256 }}`

      - uses: actions/upload-artifact@v4
        with:
          name: jimmy-state-apk
          path: jimmy-state.apk
          if-no-files-found: error
